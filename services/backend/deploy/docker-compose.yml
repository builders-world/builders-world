services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: open_world
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d open_world"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/open_world
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.jobs
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/open_world
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
