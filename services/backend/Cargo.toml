# ==============================================================================
# Workspace Root Manifest
# ==============================================================================
[workspace]
members = [
    "crates/domain",
    "crates/identity",
    "crates/integrations",
    "crates/queue",
    "crates/store",
    "services/gateway",
    "services/jobs",
]
resolver = "2"

[workspace.lints.clippy]
min_ident_chars = "warn"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["trace", "cors"] }
insta = { version = "1", features = ["json"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "time", "json"] }
redis = { version = "0.25", default-features = false, features = ["tokio-comp", "connection-manager", "streams"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
