name: Game

# The game (apps/game): unit tests, the build and the browser tests. Runs only when the game or this file changes.
on:
  pull_request:
    branches: [main]
    paths: ['apps/game/**', '.github/workflows/game.yml']
  push:
    branches: [main]
    paths: ['apps/game/**', '.github/workflows/game.yml']

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/game

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/game/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/game/artifacts/test-results
          retention-days: 7
